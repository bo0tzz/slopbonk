<!doctype html>
<html lang="en" class="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			// Apply the saved or system theme before first paint (same storage key as @immich/ui).
			try {
				const preference = JSON.parse(localStorage.getItem('immich-ui-theme'));
				const prefersDark = matchMedia('(prefers-color-scheme: dark)').matches;
				if (preference === 'light' || (preference !== 'dark' && !prefersDark)) {
					document.documentElement.classList.remove('dark');
					document.documentElement.classList.add('light');
				}
			} catch {
				// Unreadable preference: keep the default.
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-light text-dark">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
