services:
  postgres:
    image: postgres:18@sha256:eb63372c1e05c755f55fa30cbd07aecc443676fc6c0fa90b9002d01537841e1a
    environment:
      POSTGRES_USER: slopbonk
      POSTGRES_PASSWORD: slopbonk
      POSTGRES_DB: slopbonk
