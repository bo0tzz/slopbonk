services:
  postgres:
    image: postgres:18@sha256:64c8b0d31e4ab6ea665e8426ea406a94bf52de3c05b3a4a8bf713704eefa9328
    environment:
      POSTGRES_USER: slopbonk
      POSTGRES_PASSWORD: slopbonk
      POSTGRES_DB: slopbonk
    ports:
      - '5432:5432'
    volumes:
      - postgres:/var/lib/postgresql

volumes:
  postgres:
